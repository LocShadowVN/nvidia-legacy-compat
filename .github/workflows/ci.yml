- name: Build production shared library (libgbm.so.1) & verify ELF symbols
        working-directory: gbm-shim
        run: |
          cargo build --release
          ln -sf libgbm.so target/release/libgbm.so.1

          readelf -d target/release/libgbm.so | grep "libgbm.so.1"
          for sym in \
            gbm_create_device \
            gbm_device_destroy \
            gbm_bo_create \
            gbm_bo_create_with_modifiers2 \
            gbm_bo_import \
            gbm_bo_map \
            gbm_bo_unmap \
            gbm_bo_get_fd \
            gbm_bo_destroy \
            gbm_surface_create \
            gbm_surface_lock_front_buffer \
            gbm_surface_release_buffer \
            gbm_surface_destroy \
            eglGetPlatformDisplay \
            eglGetPlatformDisplayEXT \
            eglCreateWindowSurface \
            eglCreatePlatformWindowSurface \
            eglCreatePlatformWindowSurfaceEXT \
            eglSwapBuffers \
            eglDestroySurface; do
            nm -D target/release/libgbm.so | grep -q " ${sym}$" || {
              echo "[ERR] Missing exported symbol in libgbm.so: ${sym}" >&2
              exit 1
            }
          done
          echo "[PASS] All required GBM & EGL C-ABI symbols verified in libgbm.so.1"
