[package]
name = "nvidia-legacy-gbm-shim"
version = "0.1.0"
edition = "2021"
description = "Wayland GBM translation shim with explicit DMA-BUF fence sync for Legacy NVIDIA Drivers"
license = "MIT"

[lib]
name = "gbm"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["ioctl", "poll", "fs", "mman"] }
drm = "0.12"
